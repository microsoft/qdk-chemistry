      VCPKG_TRIPLET: arm64-windows-static-md
      # Leave QDK_UARCH unset: MSVC has no generic ARM64 /arch value, and
      # clang-cl auto-detects armv8-a.
      # Bump to force a rebuild of the cached dependencies.

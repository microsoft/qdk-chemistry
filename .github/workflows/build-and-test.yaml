      shell: pwsh
      timeout-minutes: 90
      env:
        OMP_NUM_THREADS: '2'
        QDK_CHEMISTRY_RUN_SLOW_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_slow_tests) || github.event_name == 'merge_group') && '1' || '0' }}
      run: |
        Push-Location python
        pytest -v --tb=short
        $code = $LASTEXITCODE
        Pop-Location
        if ($code -ne 0) { throw "pytest failed ($code)" }

  test-with-qdk-branch:
    name: Full Test with QDK Branch
    needs: coverage
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_with_qdk_branch && needs.coverage.result == 'success' }}
    runs-on: [self-hosted, 1ES.Pool=1es-gh-Dads_v5-pool-wus2, 1ES.ImageOverride=Ubuntu24.04Nightly]
    env:
      QSHARP_PYTHON_TELEMETRY: 'false'
      CMAKE_INSTALL_PREFIX: ${{ github.workspace }}/install
      QDK_BRANCH: main
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Set up environment paths
      run: |
        echo "PATH=${{ github.workspace }}/install/bin:${{ github.workspace }}/install/lib:$PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/install/lib/python3.13/site-packages:${{ github.workspace }}/install/lib:$PYTHONPATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: python/pyproject.toml

    # Runtime shared-library deps only (OpenBLAS/HDF5/libgfortran); this job doesn't build anything itself.
    - name: Install Linux runtime packages
      run: |
        MAX_WAIT_SECONDS=300
        WAIT_INTERVAL_SECONDS=5
        ELAPSED_SECONDS=0
        while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for dpkg lock (elapsed: ${ELAPSED_SECONDS}s)..."
          sleep "${WAIT_INTERVAL_SECONDS}"
          ELAPSED_SECONDS=$((ELAPSED_SECONDS + WAIT_INTERVAL_SECONDS))
          if [ "${ELAPSED_SECONDS}" -ge "${MAX_WAIT_SECONDS}" ]; then
            echo "Error: dpkg lock not released after ${MAX_WAIT_SECONDS}s."
            exit 1
          fi
        done

        sudo apt-get update
        sudo apt-get install -y \
          libhdf5-dev \
          libopenblas-dev \
          libgfortran5

    # Reuses the coverage job's build instead of rebuilding (see the matching upload step there).
    - name: Download coverage build (Linux x86-64-v3, Python 3.13)
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: qdk-chemistry-install-linux-x86-64-v3-py3.13
        path: ${{ github.workspace }}/install

    # actions/download-artifact doesn't preserve the executable bit, so install/bin/* (e.g. pytest) needs it
    # restored before it can be run.
    - name: Restore executable permissions
      run: chmod -R +x "${{ github.workspace }}/install/bin"

    - name: Test pre-installed qdk_chemistry package
      run: |
        python -c "import qdk_chemistry; print('qdk_chemistry version:', qdk_chemistry.__version__)"
        python -m ipykernel install --user --name python3 --display-name "Python 3"

    - name: Build and install qdk from branch (overwrite released version)
      run: |
        git clone --depth 1 --branch "${QDK_BRANCH}" https://github.com/microsoft/qdk.git "${{ runner.temp }}/qdk"
        echo "QDK commit: $(git -C "${{ runner.temp }}/qdk" rev-parse HEAD)"
        pip install --force-reinstall --no-deps "${{ runner.temp }}/qdk/source/qdk_package"
        echo "Installed qdk from branch: ${QDK_BRANCH}"
        python -m pip show qdk

    - name: Run Python tests
      env:
        OMP_NUM_THREADS: 4
        QDK_CHEMISTRY_RUN_SLOW_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_slow_tests) || github.event_name == 'merge_group') && '1' || '0' }}
      working-directory: python
      run: |
        set -e
        mkdir -p ../test-results
        pytest \
          --junitxml=../test-results/pytest_report.xml \
          -v \
          --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: qdk-branch-test-results
        path: test-results/

    # OpenBLAS ARM64 smoke test.
    - name: Verify OpenBLAS on ARM64
      shell: pwsh
      timeout-minutes: 15
      run: |
        $lib = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}\lib\openblas.lib"
        Write-Host "lib: $lib (exists: $(Test-Path $lib))"
        $srcPath = "${{ github.workspace }}\.pipelines\checks\openblas-smoke.c"

        Push-Location $env:RUNNER_TEMP
        cl /nologo $srcPath "$lib" /Fe:ob_smoke.exe
        if ($LASTEXITCODE -ne 0) { Pop-Location; throw "OpenBLAS probe failed to compile" }

        $p = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'ob_smoke.exe') `
          -PassThru -NoNewWindow `
          -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'ob.out') `
          -RedirectStandardError  (Join-Path $env:RUNNER_TEMP 'ob.err')
        $hung = -not $p.WaitForExit(120000)
        if ($hung) { $p.Kill(); $p.WaitForExit() }
        $out = Get-Content (Join-Path $env:RUNNER_TEMP 'ob.out') -Raw -EA SilentlyContinue
        Write-Host "--- stdout ---"; Write-Host $out
        Write-Host "--- stderr ---"; Get-Content (Join-Path $env:RUNNER_TEMP 'ob.err') -EA SilentlyContinue
        Pop-Location

        if ($hung) { throw "OpenBLAS hung: the ARM64 build is not usable (see output above)" }
        if ($out -notmatch 'ALL OPENBLAS CALLS COMPLETED') { throw "OpenBLAS probe did not run to completion" }

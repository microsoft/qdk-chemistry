name: Tutorial compatibility

# TEMPORARY: content swapped out to test coverage-comment.yaml's artifact
# download / PR-resolution / sticky-comment logic via workflow_dispatch,
# since that workflow isn't registered on the default branch yet and can't
# be dispatched on its own. Restore from tutorial-compatibility.yaml.bak
# before merging.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of a completed "Build and Test" run to test against
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post coverage comment (test)
    runs-on: ubuntu-latest
    steps:
    - name: Download coverage comment artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-comment-*
        path: artifacts
        run-id: ${{ inputs.run_id }}
        github-token: ${{ github.token }}

    - name: Resolve pull request number
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const runId = ${{ inputs.run_id }};

          const { data: run } = await github.rest.actions.getWorkflowRun({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: runId,
          });

          const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: run.head_sha,
          });

          const pr = pulls.find((p) => p.state === 'open') ?? pulls[0];
          if (!pr) {
            core.setFailed(`Could not resolve a pull request for run ${runId} (head ${run.head_sha}).`);
            return;
          }

          core.setOutput('number', pr.number);

    - name: Build combined coverage comment
      id: build-comment
      run: |
        set -euo pipefail

        comment_file="$RUNNER_TEMP/pr-comment.md"
        : > "$comment_file"
        found_report=false

        for dir in artifacts/coverage-comment-*/; do
          [ -d "$dir" ] || continue
          report="$dir/pr-comment.md"
          [ -f "$report" ] || continue

          job_label="$(basename "$dir")"
          job_label="${job_label#coverage-comment-}"

          {
            echo "<details>"
            echo "<summary>${job_label}</summary>"
            echo ""
            cat "$report"
            echo ""
            echo "</details>"
            echo ""
          } >> "$comment_file"
          found_report=true
        done

        echo "comment-file=$comment_file" >> "$GITHUB_OUTPUT"
        echo "found-report=$found_report" >> "$GITHUB_OUTPUT"

    - name: Comment PR with coverage
      if: steps.build-comment.outputs.found-report == 'true'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        number_force: ${{ steps.pr.outputs.number }}
        path: ${{ steps.build-comment.outputs.comment-file }}
        header: coverage-report

name: Debug Windows ARM64 Runner

# Verifies the Windows ARM64 self-hosted runner image has all tools required
# for actions/cache/save@v6 to work.
# Related to: actions/cache/save@v5 failure in build-and-test.yaml
# See: https://github.com/microsoft/qdk-chemistry/issues/593

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  debug-arm64:
    name: Debug Windows ARM64 runner environment
    runs-on: [self-hosted, 1ES.Pool=1es-gh-Dpsd_v6-arm-pool, 1ES.ImageOverride=windows-2025-arm64-1espt, 'JobId=qdk_chemistry-debug-arm64-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}']
    timeout-minutes: 30
    steps:

    # -------------------------------------------------------------------------
    # 1. System info
    # -------------------------------------------------------------------------
    - name: System info
      shell: pwsh
      run: |
        Write-Host "=== OS / Architecture ==="
        [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
        [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
        $env:PROCESSOR_ARCHITECTURE
        $env:PROCESSOR_IDENTIFIER
        systeminfo | Select-String -Pattern "^OS|^System Type|^Processor"

    # -------------------------------------------------------------------------
    # 2. Check git — must be ARM64 native (not x64 emulated)
    # -------------------------------------------------------------------------
    - name: Check git architecture
      shell: pwsh
      run: |
        Write-Host "=== git version & binary ==="
        $gitPath = (Get-Command git -ErrorAction SilentlyContinue).Source
        if (-not $gitPath) {
          Write-Error "FAIL: git NOT found in PATH"
          exit 1
        }
        Write-Host "git path: $gitPath"
        git --version
        $bytes    = [System.IO.File]::ReadAllBytes($gitPath)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $machine  = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        $arch = switch ($machine) {
          0x014C { "x86 (i386)" }
          0x8664 { "x86_64 (AMD64)" }
          0xAA64 { "ARM64 (AArch64)" }
          default { "Unknown (0x{0:X4})" -f $machine }
        }
        Write-Host "git binary architecture: $arch"
        if ($machine -ne 0xAA64) {
          Write-Host "WARN: git is not a native ARM64 binary (got $arch) — running under x64 emulation"
        } else {
          Write-Host "PASS: git is native ARM64"
        }

    # -------------------------------------------------------------------------
    # 3. Check git-lfs
    # -------------------------------------------------------------------------
    - name: Check git-lfs
      shell: pwsh
      run: |
        Write-Host "=== git-lfs ==="
        $lfs = Get-Command git-lfs -ErrorAction SilentlyContinue
        if (-not $lfs) {
          Write-Error "FAIL: git-lfs NOT found in PATH"
          exit 1
        }
        Write-Host "git-lfs path: $($lfs.Source)"
        git lfs version
        Write-Host "PASS: git-lfs available"

    # -------------------------------------------------------------------------
    # 4. Check gzip (must be in PATH — provided via Git\usr\bin)
    # -------------------------------------------------------------------------
    - name: Check gzip
      shell: pwsh
      run: |
        Write-Host "=== gzip ==="
        $gzip = Get-Command gzip -ErrorAction SilentlyContinue
        if (-not $gzip) {
          Write-Error "FAIL: gzip NOT found in PATH"
          exit 1
        }
        Write-Host "gzip path: $($gzip.Source)"
        gzip --version
        Write-Host "PASS: gzip available"

    # -------------------------------------------------------------------------
    # 5. Check tar (must be ARM64 native)
    # -------------------------------------------------------------------------
    - name: Check tar
      shell: pwsh
      run: |
        Write-Host "=== tar ==="
        $tar = Get-Command tar -ErrorAction SilentlyContinue
        if (-not $tar) {
          Write-Error "FAIL: tar NOT found in PATH"
          exit 1
        }
        Write-Host "tar path: $($tar.Source)"
        tar --version
        $bytes    = [System.IO.File]::ReadAllBytes($tar.Source)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $machine  = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        $arch = switch ($machine) {
          0x014C { "x86 (i386)" }
          0x8664 { "x86_64 (AMD64)" }
          0xAA64 { "ARM64 (AArch64)" }
          default { "Unknown (0x{0:X4})" -f $machine }
        }
        Write-Host "tar binary architecture: $arch"
        Write-Host "PASS: tar available ($arch)"

    # -------------------------------------------------------------------------
    # 6. Check zstd (standalone executable — required by actions/cache v5)
    # -------------------------------------------------------------------------
    - name: Check zstd
      shell: pwsh
      run: |
        Write-Host "=== zstd ==="
        $zstd = Get-Command zstd -ErrorAction SilentlyContinue
        if (-not $zstd) {
          Write-Error "FAIL: zstd NOT found in PATH — actions/cache/save@v5 will fail"
          exit 1
        }
        Write-Host "zstd path: $($zstd.Source)"
        zstd --version
        Write-Host "PASS: zstd available"

    # -------------------------------------------------------------------------
    # 7. Check 7-Zip
    # -------------------------------------------------------------------------
    - name: Check 7-Zip
      shell: pwsh
      run: |
        Write-Host "=== 7-Zip ==="
        $7z = Get-Command 7z -ErrorAction SilentlyContinue
        if (-not $7z) {
          Write-Error "FAIL: 7z NOT found in PATH"
          exit 1
        }
        Write-Host "7z path: $($7z.Source)"
        7z i 2>&1 | Select-Object -First 3
        Write-Host "PASS: 7-Zip available"

    # -------------------------------------------------------------------------
    # 8. End-to-end cache simulation
    #    Mimics what actions/cache does: tar + zstd compress, then decompress.
    # -------------------------------------------------------------------------
    - name: Simulate actions/cache compress + decompress
      shell: pwsh
      run: |
        Write-Host "=== Cache round-trip simulation ==="
        $dir     = Join-Path $env:RUNNER_TEMP "cache-test"
        $archive = Join-Path $env:RUNNER_TEMP "cache-test.tar.zst"
        New-Item -ItemType Directory -Path $dir -Force | Out-Null
        Set-Content -Path (Join-Path $dir "test.txt") -Value "cache test content"

        Write-Host "Compressing with tar + zstd..."
        tar -cf - -C $env:RUNNER_TEMP "cache-test" | zstd -o $archive
        if ($LASTEXITCODE -ne 0) {
          Write-Error "FAIL: compression failed (exit $LASTEXITCODE)"
          exit 1
        }
        Write-Host "Archive size: $((Get-Item $archive).Length) bytes"

        $extractDir = Join-Path $env:RUNNER_TEMP "cache-test-extracted"
        New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
        Write-Host "Decompressing..."
        zstd -d $archive --stdout | tar -xf - -C $extractDir
        if ($LASTEXITCODE -ne 0) {
          Write-Error "FAIL: decompression failed (exit $LASTEXITCODE)"
          exit 1
        }

        $extracted = Get-Content (Join-Path $extractDir "cache-test" "test.txt")
        if ($extracted -ne "cache test content") {
          Write-Error "FAIL: content mismatch after round-trip: '$extracted'"
          exit 1
        }
        Write-Host "PASS: cache round-trip (tar+zstd) succeeded"

    # -------------------------------------------------------------------------
    # 9. Real actions/cache/save + restore round-trip using the actual action
    # -------------------------------------------------------------------------
    - name: Create content to cache
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP "actions-cache-test"
        New-Item -ItemType Directory -Path $dir -Force | Out-Null
        Set-Content -Path (Join-Path $dir "canary.txt") -Value "actions-cache-${{ github.run_id }}"
        Write-Host "Created: $dir"

    - name: Save cache (actions/cache/save@v6)
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/actions-cache-test
        key: debug-arm64-cache-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Delete local content (simulate cold restore)
      shell: pwsh
      run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP "actions-cache-test")

    - name: Restore cache (actions/cache/restore@v6)
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/actions-cache-test
        key: debug-arm64-cache-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Verify restored content
      shell: pwsh
      run: |
        $hit = "${{ steps.cache-restore.outputs.cache-hit }}"
        Write-Host "cache-hit: $hit"
        if ($hit -ne 'true') {
          Write-Error "FAIL: cache was not restored (cache-hit=$hit)"
          exit 1
        }
        $val = Get-Content (Join-Path $env:RUNNER_TEMP "actions-cache-test" "canary.txt")
        if ($val -ne "actions-cache-${{ github.run_id }}") {
          Write-Error "FAIL: restored content mismatch: '$val'"
          exit 1
        }
        Write-Host "PASS: actions/cache save+restore round-trip succeeded"

    # -------------------------------------------------------------------------
    # 10. Full PATH dump
    # -------------------------------------------------------------------------
    - name: Dump PATH
      shell: pwsh
      run: |
        Write-Host "=== PATH entries ==="
        $env:PATH -split ";" | ForEach-Object { Write-Host $_ }

name: Tutorial compatibility

on:
  pull_request:
    paths:
    - .github/workflows/tutorial-compatibility.yaml
    - docs/source/tutorials/_versions.py
    - docs/source/tutorials/ground_state_molecular_energies_with_qpe/**
    - docs/source/_static/examples/data/tutorial_stretched_n2.structure.xyz
    - docs/source/_static/examples/ground_state_qpe_lab_notebook_*.md
    - docs/source/_static/examples/python/tutorial_*.py
    - docs/source/_static/examples/python/tutorial_*.ipynb
    - python/pyproject.toml
    - python/tests/test_sample_workflow.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  published-baseline:
    name: Published compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: python/pyproject.toml

    - name: Read tutorial package version
      id: tutorial-version
      run: |
        VERSION=$(python -c 'import runpy; print(runpy.run_path("docs/source/tutorials/_versions.py")["GROUND_STATE_TUTORIAL_VERSION"])')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install published tutorial environment
      run: |
        python -m pip install --upgrade pip
        python -m pip install \
          "qdk-chemistry[jupyter]==${{ steps.tutorial-version.outputs.version }}" \
          nbclient \
          nbformat \
          pytest \
          pytest-env
        python -m ipykernel install --user --name python3 --display-name "Python 3"

    - name: Verify tutorial setup
      env:
        GROUND_STATE_TUTORIAL_VERSION: ${{ steps.tutorial-version.outputs.version }}
      run: python docs/source/_static/examples/python/tutorial_qpe_setup.py

    - name: Run tutorial scripts
      run: |
        for example in docs/source/_static/examples/python/tutorial_*.py; do
          if [ "$(basename "$example")" != 'tutorial_qpe_setup.py' ] && ! grep -q '# docs-example: slow' "$example"; then
            python "$example"
          fi
        done

    - name: Run published tutorial compatibility checks
      env:
        QDK_CHEMISTRY_RUN_SLOW_TESTS: '1'
      run: python -m pytest -q python/tests/test_sample_workflow.py -m tutorial_baseline

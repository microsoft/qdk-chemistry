<title id="tutorial-qpe-energy-accounting-title">Molecular-energy reconstruction and comparison</title>
<desc id="tutorial-qpe-energy-accounting-desc">Energy-accounting flow for the molecular IQPE result. The active energy measured by phase estimation and the classically added core energy combine to form the reconstructed selected-space total energy. The classical CASCI energy for the same selected-space Hamiltonian is subtracted from that total to form the signed algorithmic difference. Basis-set and active-space model errors are outside this comparison.</desc>

# Pipeline for building and publishing Python wheels for QDK Chemistry
# Publishing can only be triggered manually after approval
# Non-publishing builds are triggered nightly on main to ensure the current builds are valid

trigger: none
pr: none

schedules:
- cron: 0 7 * * * # Time is in UTC; this runs at 11PM Pacific during standard time and 12AM Pacific during daylight time
  displayName: Nightly Build
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: self
    path: qdk-chemistry

parameters:
- name: matrix
  type: object
  default:
  - name: linux_x86_64
    os: linux
    arch: x86_64
    march: x86-64-v3
    imageName: Ubuntu24.04Nightly
  - name: linux_aarch64
    os: linux
    arch: aarch64
    march: armv8-a
    imageName: 1es-pt-azurelinux3-arm
  - name: macos_arm64
    os: macOS
    arch: aarch64
    march: armv8-a
    imageName: ACES_VM_SharedPool_Tahoe
  - name: windows_x86_64
    os: windows
    arch: x86_64
    march: x86-64-v3
    imageName: windows-2025-1espt
  - name: windows_aarch64
    os: windows
    arch: aarch64
    march: armv8-a
    imageName: windows-2025-arm64-1espt
  displayName: Target platforms
- name: pythonVersions
  type: stringList
  values:
  - '3.11'
  - '3.12'
  default:
  - '3.11'
  - '3.12'
  displayName: Python build versions (3.12 builds an ABI3 wheel for 3.12+)
- name: publishEsrp
  type: boolean
  default: false
  displayName: Publish to PyPI
- name: devTag
  type: string
  default: None
  displayName: PyPI Development Tag (e.g. 'dev1', 'rc1', etc.)
- name: runSlowTests
  type: boolean
  default: true
  displayName: Run slow tests

variables:
- group: QdkChemistry
- name: ComponentDetection.MaxDetectionThreads
  value: '16'
# Emit a clean, publishable version (no +local suffix) when publishing to PyPI.
- name: QDK_CHEMISTRY_RELEASE_BUILD
  value: ${{ parameters.publishEsrp }}
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: DefaultDeny,CFSClean,CFSClean2,CFSClean3
    sdl:
      autobaseline:
        enableForGitHub: true
      componentgovernance:
        useAgentBuildDirectory: true
      codeql:
        compiled:
          enabled: true
        sourceLanguages: python
        binaryLanguages: cpp
      armory:
        enabled: false
        justificationForDisabling: ARM templates are not used in this repository.
        break: false
      eslint:
        enabled: false
        justificationForDisabling: JavaScript is not used in this repository.
        exitOnFatalError: true
      sourceAnalysisPool:
        name: ado-1es-Da_v4
        image: windows-2025-vanilla-1espt
        os: windows
    stages:
    - stage: Build
      displayName: Build and Test Python Wheels
      jobs:
      # Windows C++ dependency build (vcpkg + FetchContent targets).
      # Runs once so the parallel Python-version wheel jobs share a single
      # warm cache entry instead of each rebuilding deps independently.
      # Gated on windows_x86_64 being present in the matrix, so overriding the matrix (e.g. Linux-only) doesn't
      # waste a Windows agent on an unused dependency build.
      - ${{ each target in parameters.matrix }}:
        - ${{ if eq(target.name, 'windows_x86_64') }}:
          - job: Build_windows_x86_64_deps
            pool:
              name: $(CPU_POOL_X86)
              demands:
              - ImageOverride -equals windows-2025-1espt
              os: windows
            timeoutInMinutes: 480
            displayName: Build Windows x86_64 C++ dependencies
            steps:
            - template: .pipelines/templates/build-pip-wheels-windows-deps.yml@self
              parameters:
                march: ${{ target.march }}

      # ExaChem (+ TAMM) build for the Linux x86_64 test environment, built once here (not per-Python-version)
      # and published as a pipeline artifact. Entirely separate from qdk-chemistry's own wheel build/prefix.
      # Gated on linux_x86_64 being present in the matrix, same reasoning as the Windows deps job above.
        - ${{ if eq(target.name, 'linux_x86_64') }}:
          - job: Build_linux_x86_64_exachem
            pool:
              name: $(CPU_POOL_X86)
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: linux
            timeoutInMinutes: 480
            displayName: Build Linux x86_64 ExaChem (BLIS+LibFLAME)
            templateContext:
              outputs:
              - output: pipelineArtifact
                displayName: Upload ExaChem install (Linux x86_64)
                # Hardcoded path, not $(System.DefaultWorkingDirectory) -- see the test job's download input below.
                targetPath: $(Agent.BuildDirectory)/qdk-chemistry/exachem_install
                artifactName: linux-x86_64-exachem-install
            steps:
            - template: .pipelines/templates/build-exachem-linux.yml@self
              parameters:
                march: ${{ target.march }}
                dockerImage: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04

      # Same rationale for Windows ARM64, on the 1ES ARM64 pool. hostArchitecture
      # avoids the 1ES template defaulting to an x64-emulated agent.
      # Gated on windows_aarch64 being present so matrix overrides don't build unused dependencies.
        - ${{ if eq(target.name, 'windows_aarch64') }}:
          - job: Build_windows_aarch64_deps
            pool:
              name: aqe-1es-Dpds_v6-arm-pool
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: windows
              hostArchitecture: Arm64
            timeoutInMinutes: 480
            displayName: Build Windows ARM64 C++ dependencies
            steps:
            - template: .pipelines/templates/build-pip-wheels-windows-deps.yml@self
              parameters:
                march: ${{ target.march }}
                arch: arm64

      - ${{ each target in parameters.matrix }}:
        - job: Build_${{ target.name }}
          ${{ if eq(target.name, 'macos_arm64') }}:
            pool:
              name: AcesShared
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ elseif eq(target.name, 'windows_aarch64') }}:
            dependsOn: Build_windows_aarch64_deps
            pool:
              name: aqe-1es-Dpds_v6-arm-pool
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ elseif eq(target.name, 'linux_aarch64') }}:
            pool:
              name: aqe-1es-Dpsd_v5-arm-pool
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ elseif eq(target.name, 'windows_x86_64') }}:
            dependsOn: Build_windows_x86_64_deps
            pool:
              name: $(CPU_POOL_X86)
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: windows
          ${{ elseif eq(target.name, 'linux_x86_64') }}:
            pool:
              name: $(CPU_POOL_X86)
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}

          timeoutInMinutes: 480
          strategy:
            matrix:
              ${{ each py in parameters.pythonVersions }}:
                Py${{ replace(py, '.', '') }}:
                  pythonVersion: ${{ py }}
            maxParallel: 5
          displayName: Build ${{ target.march }} ${{ target.os }} wheels
          variables:
            # Must stay a literal value: ADO's variables: block doesn't expand $VAR.
            LD_LIBRARY_PATH: /usr/local/lib
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: Upload Python $(pythonVersion) Wheels for ${{ target.os }} ${{ target.march }}
              targetPath: $(System.DefaultWorkingDirectory)/python/repaired_wheelhouse/
              artifactName: ${{ target.os }}-${{ target.arch }}-wheels-python$(pythonVersion)
            - ${{ if and(eq(target.name, 'linux_x86_64'), parameters.publishEsrp) }}:
              - output: pipelineArtifact
                displayName: Upload Python $(pythonVersion) debug symbols
                targetPath: $(System.DefaultWorkingDirectory)/python/debug_symbols
                artifactName: linux-x86_64-symbols-python$(pythonVersion)
          steps:
          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: AzureQuantum/quantum-apps-dependencies
              onlyAddExtraIndex: false

          # Build - Linux x86_64
          - ${{ if eq(target.name, 'linux_x86_64') }}:
            - template: .pipelines/templates/build-pip-wheels.yml@self
              parameters:
                march: ${{ target.march }}
                buildTesting: OFF
                enableCoverage: OFF
                agentBuildDirectory: $(Agent.BuildDirectory)
                dockerImage: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
                imageTag: linux/amd64
                pythonVersion: $(pythonVersion)
                devTag: ${{ parameters.devTag }}

          # Build - Linux ARM64
          - ${{ if eq(target.name, 'linux_aarch64') }}:
            - template: .pipelines/templates/build-pip-wheels.yml@self
              parameters:
                march: ${{ target.march }}
                buildTesting: OFF
                enableCoverage: OFF
                agentBuildDirectory: $(Agent.BuildDirectory)
                dockerImage: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
                imageTag: linux/arm64/v8
                pythonVersion: $(pythonVersion)
                devTag: ${{ parameters.devTag }}

          # Build - macOS ARM64
          - ${{ if eq(target.name, 'macos_arm64') }}:
            - template: .pipelines/templates/build-pip-wheels.yml@self
              parameters:
                march: ${{ target.march }}
                buildTesting: OFF
                enableCoverage: OFF
                agentBuildDirectory: $(Agent.BuildDirectory)
                pythonVersion: $(pythonVersion)
                macBuild: ON
                devTag: ${{ parameters.devTag }}

          # Build - Windows (x86_64 and ARM64)
          - ${{ if or(eq(target.name, 'windows_x86_64'), eq(target.name, 'windows_aarch64')) }}:
            - template: .pipelines/templates/build-pip-wheels-windows.yml@self
              parameters:
                march: ${{ target.march }}
                buildTesting: OFF
                enableCoverage: OFF
                pythonVersion: $(pythonVersion)
                devTag: ${{ parameters.devTag }}
                ${{ if eq(target.name, 'windows_aarch64') }}:
                  arch: arm64

          # SBoM Manifest Generator Task requires we transfer ownership of the wheel directory
          # back to the original base image user (Linux/macOS only; not needed on Windows).
          - ${{ if or(eq(target.name, 'linux_x86_64'), eq(target.name, 'linux_aarch64'), eq(target.name, 'macos_arm64')) }}:
            - script: |
                sudo chown -R $(id -u):$(id -g) $(System.DefaultWorkingDirectory)/python/repaired_wheelhouse
                if [ -d "$(System.DefaultWorkingDirectory)/python/debug_symbols" ]; then
                  sudo chown -R $(id -u):$(id -g) $(System.DefaultWorkingDirectory)/python/debug_symbols
                fi
              displayName: Fix wheel directory ownership

      # Separate jobs test the published wheel artifacts on independent agents.
      # The ABI3 runtime legs share one wheel, not a mutable Python environment.
      - ${{ each target in parameters.matrix }}:
        - job: Test_${{ target.name }}
          dependsOn:
          - Build_${{ target.name }}
          - ${{ if eq(target.name, 'linux_x86_64') }}:
            - Build_linux_x86_64_exachem
          ${{ if eq(target.name, 'macos_arm64') }}:
            pool:
              name: AcesShared
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ elseif eq(target.name, 'windows_aarch64') }}:
            pool:
              name: aqe-1es-Dpds_v6-arm-pool
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ elseif eq(target.name, 'linux_aarch64') }}:
            pool:
              name: aqe-1es-Dpsd_v5-arm-pool
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
              hostArchitecture: Arm64
          ${{ else }}:
            pool:
              name: $(CPU_POOL_X86)
              demands:
              - ImageOverride -equals ${{ target.imageName }}
              os: ${{ target.os }}
          timeoutInMinutes: 480
          workspace:
            clean: all
          strategy:
            matrix:
              ${{ if containsValue(parameters.pythonVersions, '3.11') }}:
                Py311:
                  pythonVersion: '3.11'
                  wheelPythonVersion: '3.11'
              ${{ if containsValue(parameters.pythonVersions, '3.12') }}:
                ${{ each testPython in split('3.12,3.13,3.14', ',') }}:
                  Py${{ replace(testPython, '.', '') }}:
                    pythonVersion: ${{ testPython }}
                    wheelPythonVersion: '3.12'
            maxParallel: 4
          displayName: Test ${{ target.os }} ${{ target.arch }} wheels
          templateContext:
            sdl:
              codeql:
                compiled:
                  enabled: false
                  justificationForDisabling: No compilation in wheel test jobs; compiled analysis runs in the build jobs.
            inputs:
            # Keep downloads outside the checkout, which cleans untracked files.
            - input: pipelineArtifact
              artifactName: ${{ target.os }}-${{ target.arch }}-wheels-python$(wheelPythonVersion)
              targetPath: $(Agent.BuildDirectory)/wheelhouse
            - ${{ if eq(target.name, 'linux_x86_64') }}:
              - input: pipelineArtifact
                artifactName: linux-x86_64-exachem-install
                targetPath: $(Agent.BuildDirectory)/exachem_install
          steps:
          - checkout: self
            persistCredentials: true
            path: qdk-chemistry
            fetchDepth: 1
            retryCountOnTaskFailure: 3

          - task: PipAuthenticate@1
            displayName: Pip Authenticate
            inputs:
              artifactFeeds: AzureQuantum/quantum-apps-dependencies
              onlyAddExtraIndex: false

          - ${{ if eq(target.os, 'windows') }}:
            - pwsh: |
                $ErrorActionPreference = 'Stop'
                $wheelhouse = "$(System.DefaultWorkingDirectory)/python/repaired_wheelhouse"
                New-Item -ItemType Directory -Force -Path $wheelhouse | Out-Null
                Copy-Item "$(Agent.BuildDirectory)/wheelhouse/*.whl" $wheelhouse
              displayName: Stage downloaded wheel
            - template: .pipelines/templates/test-pip-wheels-windows.yml@self
              parameters:
                pythonVersion: $(pythonVersion)
                runSlowTests: ${{ parameters.runSlowTests }}
                ${{ if eq(target.arch, 'aarch64') }}:
                  arch: arm64
          - ${{ else }}:
            - script: |
                set -e
                mkdir -p "$(Agent.BuildDirectory)/qdk-chemistry/python/repaired_wheelhouse"
                cp "$(Agent.BuildDirectory)/wheelhouse/"*.whl "$(Agent.BuildDirectory)/qdk-chemistry/python/repaired_wheelhouse/"
              displayName: Stage downloaded wheel
            - template: .pipelines/templates/test-pip-wheels.yml@self
              parameters:
                agentBuildDirectory: $(Agent.BuildDirectory)
                pythonVersion: $(pythonVersion)
                runSlowTests: ${{ parameters.runSlowTests }}
                ${{ if eq(target.os, 'macOS') }}:
                  macBuild: ON
                ${{ else }}:
                  dockerImage: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
                  ${{ if eq(target.arch, 'x86_64') }}:
                    imageTag: linux/amd64
                    exachemRequired: true
                  ${{ else }}:
                    imageTag: linux/arm64/v8


    - stage: Approval
      displayName: Approval
      dependsOn: Build
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), ${{ parameters.publishEsrp }})
      jobs:
      - job: Approval
        pool: server
        timeoutInMinutes: 1440     # job times out in 1 day
        steps:
        - task: ManualValidation@0
          timeoutInMinutes: 1440       # task times out in 1 day
          inputs:
            notifyUsers: ''
            instructions: Please verify artifacts and approve the release
            onTimeout: reject


    - stage: Release
      displayName: Release
      dependsOn: Approval
      condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), ${{ parameters.publishEsrp }})
      jobs:
      - job: Publish_Python_Packages
        pool:
          name: Azure-Pipelines-DevTools-EO
          image: ubuntu-latest
          os: linux
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:     # Declare all build artifacts to be consumed in the release job
          - ${{ each target in parameters.matrix }}:
            - ${{ each py in parameters.pythonVersions }}:
              - input: pipelineArtifact
                artifactName: ${{ target.os }}-${{ target.arch }}-wheels-python${{ py }}
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/${{ target.os }}-${{ target.arch }}-wheels-python${{ py }}
              - ${{ if and(eq(target.name, 'linux_x86_64'), parameters.publishEsrp) }}:
                - input: pipelineArtifact
                  artifactName: linux-x86_64-symbols-python${{ py }}
                  targetPath: $(System.DefaultWorkingDirectory)/artifacts/linux-x86_64-symbols-python${{ py }}
        steps:
        - script: |
            mkdir -p $(System.DefaultWorkingDirectory)/target/wheels
            find $(System.DefaultWorkingDirectory)/artifacts -name "*.whl" -exec cp {} $(System.DefaultWorkingDirectory)/target/wheels/ \;
            ls $(System.DefaultWorkingDirectory)/target/wheels
          displayName: Collect Python Artifacts for Release

        # Publish symbols only after all runtime tests and release approval.
        - ${{ each target in parameters.matrix }}:
          - ${{ if and(eq(target.name, 'linux_x86_64'), parameters.publishEsrp) }}:
            - ${{ each py in parameters.pythonVersions }}:
              - task: PublishSymbols@2
                displayName: Publish Python ${{ py }} debug symbols
                inputs:
                  SymbolsFolder: $(System.DefaultWorkingDirectory)/artifacts/linux-x86_64-symbols-python${{ py }}
                  IndexSources: false
                  SymbolServerType: TeamServices
                  SearchPattern: '**/*.debug'
                  publishLinuxSymbols: true

        # Setting the contenttype to the wrong value will allow us to do a dry run of this task without
        # publishing anything, according to the ESRP docs. When debugging, set contenttype: NPM to prevent publishing to PyPI.
        - task: EsrpRelease@12
          condition: succeeded()
          displayName: Publish Python Packages
          inputs:
            connectedservicename: PME ESRP Azure Connection
            usemanagedidentity: true
            keyvaultname: quantum-esrp-kv
            signcertname: ESRPCert
            clientid: 832c049d-cd07-4c1c-bfa5-c07250d190cb
            intent: PackageDistribution
            contenttype: PyPi
            contentsource: Folder
            folderlocation: $(System.DefaultWorkingDirectory)/target/wheels
            waitforreleasecompletion: true
            owners: davidwillia@microsoft.com, janunsleber@microsoft.com, nathanbaker@microsoft.com
            approvers: davidwillia@microsoft.com, janunsleber@microsoft.com, nathanbaker@microsoft.com
            serviceendpointurl: https://api.esrp.microsoft.com
            mainpublisher: ESRPRELPACMAN
            domaintenantid: 975f013f-7f24-47e8-a7d3-abc4752bf346

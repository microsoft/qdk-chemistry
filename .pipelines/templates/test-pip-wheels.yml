parameters:
- name: agentBuildDirectory
  type: string
  default: $(Agent.BuildDirectory)
- name: dockerImage
  type: string
  default: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
- name: imageTag
  type: string
  default: linux/amd64
- name: pythonVersion
  type: string
  default: 3.11
- name: macBuild
  type: string
  default: OFF
- name: runSlowTests
  type: boolean
  default: true
- name: exachemRequired
  type: boolean
  default: false
- name: condition
  type: string
  default: succeeded()

steps:
- ${{ if and(eq(parameters.macBuild, 'OFF'), eq(parameters.imageTag, 'linux/amd64')) }}:
  - script: |
      echo "Running wheel tests (Docker linux/amd64)..."
      docker run --rm \
        --platform "$QDK_TEST_PLATFORM" \
        -e PIP_INDEX_URL \
        -e SYSTEM_ACCESSTOKEN \
        -e QSHARP_PYTHON_TELEMETRY=false \
        -e QDK_CHEMISTRY_RUN_SLOW_TESTS \
        -e EXACHEM_REQUIRED \
        -v "$QDK_AGENT_BUILD_DIRECTORY:/workspace" \
        -w /workspace/qdk-chemistry/python \
        "$QDK_TEST_IMAGE" \
        bash ../.pipelines/pip-scripts/test-pip-wheels.sh "$QDK_PYTHON_VERSION" \
                                                          "$QDK_MAC_BUILD"
    displayName: Test wheel (Docker linux/amd64)
    condition: ${{ parameters.condition }}
    env:
      QDK_TEST_PLATFORM: ${{ parameters.imageTag }}
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_TEST_IMAGE: ${{ parameters.dockerImage }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      QDK_CHEMISTRY_RUN_SLOW_TESTS: ${{ parameters.runSlowTests }}
      EXACHEM_REQUIRED: ${{ parameters.exachemRequired }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if and(eq(parameters.macBuild, 'OFF'), ne(parameters.imageTag, 'linux/amd64')) }}:
  - script: |
      echo "Running wheel tests (Docker $QDK_TEST_PLATFORM)..."
      docker run --rm \
        --platform "$QDK_TEST_PLATFORM" \
        -e PIP_INDEX_URL \
        -e SYSTEM_ACCESSTOKEN \
        -e QSHARP_PYTHON_TELEMETRY=false \
        -e QDK_CHEMISTRY_RUN_SLOW_TESTS \
        -v "$QDK_AGENT_BUILD_DIRECTORY:/workspace" \
        -w /workspace/qdk-chemistry/python \
        "$QDK_TEST_IMAGE" \
        bash ../.pipelines/pip-scripts/test-pip-wheels.sh "$QDK_PYTHON_VERSION" \
                                                          "$QDK_MAC_BUILD"
    displayName: Test wheel (Docker ${{ parameters.imageTag }})
    condition: ${{ parameters.condition }}
    env:
      QDK_TEST_PLATFORM: ${{ parameters.imageTag }}
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_TEST_IMAGE: ${{ parameters.dockerImage }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      QDK_CHEMISTRY_RUN_SLOW_TESTS: ${{ parameters.runSlowTests }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if eq(parameters.macBuild, 'ON') }}:
  - script: |
      echo "Running wheel tests (native)..."
      cd "$QDK_AGENT_BUILD_DIRECTORY/qdk-chemistry/python"
      bash ../.pipelines/pip-scripts/test-pip-wheels.sh "$QDK_PYTHON_VERSION" \
                                                        "$QDK_MAC_BUILD"
    displayName: Test wheel (native)
    condition: ${{ parameters.condition }}
    env:
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      QDK_CHEMISTRY_RUN_SLOW_TESTS: ${{ parameters.runSlowTests }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

parameters:
- name: march
  type: string
  default: armv8-a
- name: buildType
  type: string
  default: Release
- name: buildTesting
  type: string
  default: ON
- name: enableCoverage
  type: string
  default: OFF
- name: agentBuildDirectory
  type: string
  default: $(Agent.BuildDirectory)
- name: dockerImage
  type: string
  default: mcr.microsoft.com/mirror/docker/library/ubuntu:24.04
- name: imageTag
  type: string
  default: linux/amd64
- name: pythonVersion
  type: string
  default: 3.11
- name: macBuild
  type: string
  default: OFF
- name: devTag
  type: string
  default: 'None'

steps:
- checkout: self
  persistCredentials: true
  path: qdk-chemistry
  fetchDepth: 1
  retryCountOnTaskFailure: 3

# Check if user provided a development tag for release and validate before building wheels.
# If a development tag is provided and is valid, the VERSION file in the top level directory
# will be updated to include the dev tag before publishing to PyPI.
- script: |
    set -e
    python3 "$AGENT_BUILDDIRECTORY/qdk-chemistry/.pipelines/pip-scripts/versioning.py" \
      --version-file "$AGENT_BUILDDIRECTORY/qdk-chemistry/VERSION" \
      --dev-tag "$QDK_DEV_TAG"
    cat "$AGENT_BUILDDIRECTORY/qdk-chemistry/VERSION"
  displayName: Validate/Set Development Version for Wheels
  condition: ne('${{ parameters.devTag }}', 'None')
  env:
    QDK_DEV_TAG: ${{ parameters.devTag }}

- ${{ if and(eq(parameters.macBuild, 'OFF'), eq(parameters.imageTag, 'linux/amd64')) }}:
  - script: |
      echo "Running pip wheel build (Linux $QDK_UARCH on $QDK_BUILD_PLATFORM)..."
      docker run --rm \
        --platform "$QDK_BUILD_PLATFORM" \
        -v "$QDK_AGENT_BUILD_DIRECTORY:/workspace:rshared" \
        -e PIP_INDEX_URL \
        -e SYSTEM_ACCESSTOKEN \
        -e QDK_UARCH \
        -e QDK_CHEMISTRY_RELEASE_BUILD \
        -w /workspace/qdk-chemistry \
        "$QDK_BUILD_IMAGE" \
      bash .pipelines/pip-scripts/build-pip-wheels.sh "$QDK_UARCH" \
                                                      "$QDK_PYTHON_VERSION" \
                                                      "$QDK_BUILD_TYPE" \
                                                      "$QDK_BUILD_TESTING" \
                                                      "$QDK_ENABLE_COVERAGE" \
                                                      "$QDK_MAC_BUILD"
    displayName: Build wheel (Linux ${{ parameters.march }})
    retryCountOnTaskFailure: 2
    env:
      QDK_UARCH: ${{ parameters.march }}
      QDK_BUILD_PLATFORM: ${{ parameters.imageTag }}
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_BUILD_IMAGE: ${{ parameters.dockerImage }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_BUILD_TYPE: ${{ parameters.buildType }}
      QDK_BUILD_TESTING: ${{ parameters.buildTesting }}
      QDK_ENABLE_COVERAGE: ${{ parameters.enableCoverage }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      # Required by the conda bootstrap to authenticate to the Azure Artifacts
      # feed that proxies ms-ensureconda + conda channels.
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if and(eq(parameters.macBuild, 'OFF'), ne(parameters.imageTag, 'linux/amd64')) }}:
  - script: |
      echo "Running pip wheel build (Linux $QDK_UARCH on $QDK_BUILD_PLATFORM)..."
      docker run --rm \
        --platform "$QDK_BUILD_PLATFORM" \
        -v "$QDK_AGENT_BUILD_DIRECTORY:/workspace:rshared" \
        -e PIP_INDEX_URL \
        -e SYSTEM_ACCESSTOKEN \
        -e QDK_UARCH \
        -e QDK_CHEMISTRY_RELEASE_BUILD \
        -w /workspace/qdk-chemistry \
        "$QDK_BUILD_IMAGE" \
      bash .pipelines/pip-scripts/build-pip-wheels.sh "$QDK_UARCH" \
                                                      "$QDK_PYTHON_VERSION" \
                                                      "$QDK_BUILD_TYPE" \
                                                      "$QDK_BUILD_TESTING" \
                                                      "$QDK_ENABLE_COVERAGE" \
                                                      "$QDK_MAC_BUILD"
    displayName: Build wheel (Linux ${{ parameters.march }})
    retryCountOnTaskFailure: 2
    env:
      QDK_UARCH: ${{ parameters.march }}
      QDK_BUILD_PLATFORM: ${{ parameters.imageTag }}
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_BUILD_IMAGE: ${{ parameters.dockerImage }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_BUILD_TYPE: ${{ parameters.buildType }}
      QDK_BUILD_TESTING: ${{ parameters.buildTesting }}
      QDK_ENABLE_COVERAGE: ${{ parameters.enableCoverage }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- ${{ if eq(parameters.macBuild, 'ON') }}:
  - script: |
      set -x
      echo "Running pip wheel build (native)..."
      cd "$QDK_AGENT_BUILD_DIRECTORY/qdk-chemistry"
      bash .pipelines/pip-scripts/build-pip-wheels.sh "$QDK_UARCH" \
                                                      "$QDK_PYTHON_VERSION" \
                                                      "$QDK_BUILD_TYPE" \
                                                      "$QDK_BUILD_TESTING" \
                                                      "$QDK_ENABLE_COVERAGE" \
                                                      "$QDK_MAC_BUILD"
    displayName: Build wheel (macOS native)
    retryCountOnTaskFailure: 2
    env:
      QDK_UARCH: ${{ parameters.march }}
      QDK_AGENT_BUILD_DIRECTORY: ${{ parameters.agentBuildDirectory }}
      QDK_PYTHON_VERSION: ${{ parameters.pythonVersion }}
      QDK_BUILD_TYPE: ${{ parameters.buildType }}
      QDK_BUILD_TESTING: ${{ parameters.buildTesting }}
      QDK_ENABLE_COVERAGE: ${{ parameters.enableCoverage }}
      QDK_MAC_BUILD: ${{ parameters.macBuild }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

parameters:
- name: march
  type: string
  default: x86-64-v3
- name: buildType
  type: string
  default: Release
- name: buildTesting
  type: string
  default: 'OFF'
- name: enableCoverage
  type: string
  default: 'OFF'
- name: pythonVersion
  type: string
  default: '3.11'
- name: devTag
  type: string
  default: 'None'
- name: arch
  type: string
  default: x64
  values:
  - x64
  - arm64
- name: pythonEnv
  type: string
  default: conda
  values:
  - conda
  - venv

steps:
- checkout: self
  persistCredentials: true
  path: qdk-chemistry
  fetchDepth: 1
  retryCountOnTaskFailure: 3

# The venv path builds on the agent's own interpreter, so it has to be provisioned
# first. Conda builds bring their own Python and skip this.
- ${{ if eq(parameters.pythonEnv, 'venv') }}:
  - task: UsePythonVersion@0
    displayName: Use Python ${{ parameters.pythonVersion }} (${{ parameters.arch }})
    inputs:
      versionSpec: '${{ parameters.pythonVersion }}'
      ${{ if eq(parameters.arch, 'arm64') }}:
        architecture: 'arm64'

- pwsh: |
    python "$(System.DefaultWorkingDirectory)\.pipelines\pip-scripts\versioning.py" `
      --version-file "$(System.DefaultWorkingDirectory)\VERSION" `
      --dev-tag ${{ parameters.devTag }}
    Get-Content "$(System.DefaultWorkingDirectory)\VERSION"
  displayName: Validate/Set Development Version for Wheels
  condition: ne('${{ parameters.devTag }}', 'None')

# Import the VS developer environment (INCLUDE, LIB, PATH, etc.) so that
# cl.exe and the MSVC linker are available to all subsequent steps.
# Also resolves the MSVC toolset version and vcpkg triplet for the cache keys.
- pwsh: $(System.DefaultWorkingDirectory)\.pipelines\install-scripts\setup-msvc-env.ps1 -Arch ${{ parameters.arch }}
  displayName: Set up MSVC environment (${{ parameters.arch }})

# Restore the dependency build dirs separately to avoid a known Windows issue
# with Cache@2 multi-line `path`: the task passes both lines as a single tar
# argument, causing "could not chdir" at save time. Two tasks work reliably.
- task: Cache@2
  displayName: Restore/save vcpkg dependency cache
  inputs:
    key: >-
      "windows-vcpkg-${{ parameters.arch }}-windows-static-md-r1" | "$(MSVC_TOOLSET)" |
      vcpkg.json |
      vcpkg-configuration.json |
      vcpkg-overlay/**/*
    path: $(System.DefaultWorkingDirectory)/vcpkg_installed
    cacheHitVar: VCPKG_CACHE_RESTORED

# These keys must stay in step with build-pip-wheels-windows-deps.yml, which is
# what populates the caches. The final phase token differs by architecture
# because that is where the complete install tree ends up: x86_64 builds the
# whole set in one job under "all", while ARM64 splits the work and finishes
# under "rest".
- task: Cache@2
  displayName: Restore/save C++ deps install cache
  inputs:
    ${{ if eq(parameters.arch, 'arm64') }}:
      key: >-
        "windows-deps-install-msvc-${{ parameters.arch }}-windows-static-md-r1" | "$(MSVC_TOOLSET)" |
        cpp/manifest/qdk-chemistry/cgmanifest.json |
        external/macis/manifest/cgmanifest.json |
        cpp/cmake/patches/**/* |
        .pipelines/toolchains/windows.cmake |
        "rest"
    ${{ else }}:
      key: >-
        "windows-deps-install-msvc-${{ parameters.arch }}-windows-static-md-r1" | "$(MSVC_TOOLSET)" |
        cpp/manifest/qdk-chemistry/cgmanifest.json |
        external/macis/manifest/cgmanifest.json |
        cpp/cmake/patches/**/* |
        .pipelines/toolchains/windows.cmake |
        "all"
    path: $(System.DefaultWorkingDirectory)/deps-install-msvc
    cacheHitVar: DEPS_INSTALL_CACHE_RESTORED

# Full qdk build, C++ tests, conda environment setup, and Python wheel build.
# SYSTEM_ACCESSTOKEN is required by bootstrap-conda for the Azure Artifacts feed.
- pwsh: |
    & "$(System.DefaultWorkingDirectory)\.pipelines\pip-scripts\build-pip-wheels-windows.ps1" `
        -SrcDir         "$(System.DefaultWorkingDirectory)" `
        -March          "${{ parameters.march }}" `
        -BuildType      "${{ parameters.buildType }}" `
        -BuildTesting   "${{ parameters.buildTesting }}" `
        -EnableCoverage "${{ parameters.enableCoverage }}" `
        -ClPath         "$(CL_PATH)" `
        -Triplet        "$(VCPKG_TRIPLET)" `
        -PythonEnv      "${{ parameters.pythonEnv }}" `
        -PythonVersion  "${{ parameters.pythonVersion }}" `
        -DevTag         "${{ parameters.devTag }}"
  displayName: Build C++ library, run tests, build Python wheel
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    OMP_NUM_THREADS: '2'

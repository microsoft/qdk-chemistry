parameters:
- name: pythonVersion
  type: string
  default: '3.11'
- name: runSlowTests
  type: boolean
  default: true
- name: condition
  type: string
  default: succeeded()
- name: arch
  type: string
  default: x64
  values:
  - x64
  - arm64

steps:
# Windows ARM64 tests in a venv on the agent's own interpreter; every other
# target uses the policy-default conda path, and conda brings its own Python.
# See the note in build-pip-wheels-windows.yml for why ARM64 cannot use
# UsePythonVersion@0.
- ${{ if eq(parameters.arch, 'arm64') }}:
  - pwsh: >-
      $(System.DefaultWorkingDirectory)\.pipelines\install-scripts\ensure-python-windows.ps1
      -Arch arm64 -Version ${{ parameters.pythonVersion }} -IncludePip
    displayName: Use Python ${{ parameters.pythonVersion }} (arm64)

- pwsh: |
    $ErrorActionPreference = 'Stop'
    # Windows ARM64 is the only target without usable win-arm64 conda packages.
    $pythonEnv = if ('${{ parameters.arch }}' -eq 'arm64') { 'venv' } else { 'conda' }
    & "$(System.DefaultWorkingDirectory)\.pipelines\pip-scripts\test-pip-wheels-windows.ps1" `
      -SrcDir "$(System.DefaultWorkingDirectory)" `
      -PythonVersion '${{ parameters.pythonVersion }}' `
      -PythonEnv $pythonEnv `
      -Triplet '$(VCPKG_TRIPLET)' `
      -RunSlowTests '${{ parameters.runSlowTests }}'
  displayName: Test wheel (Windows, Python ${{ parameters.pythonVersion }})
  condition: ${{ parameters.condition }}
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
